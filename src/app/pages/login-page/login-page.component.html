<!-- component -->
<div class="flex min-h-screen items-center justify-center">
  <div
    class="relative flex flex-col rounded-xl bg-transparent bg-clip-border text-gray-700 shadow-none"
  >
    <h4
      class="block font-sans text-2xl font-semibold leading-snug tracking-normal text-white antialiased"
    >
      Iniciar sesión
    </h4>

    <form [formGroup]= "myForm" (ngSubmit)="onSave()" class="mt-8 mb-2 w-80 max-w-screen-lg sm:w-96">
      <div class="mb-4 flex flex-col gap-6">
        <div class="relative h-11 w-full min-w-[200px]">
          <input
            class="h-full w-full rounded-md border placeholder-shown:border bg-transparent px-3 py-3 font-sans text-sm font-normal outline outline-0 transition-all peer border-blue-gray-200 text-white placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 focus:border-2 focus:border-red-700 focus:border-t-transparent focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0"
            placeHolder=" "
            formControlName="name"
          />
          <label
            class="before:content[' '] after:content[' '] pointer-events-none absolute left-0 -top-1.5 flex h-full w-full select-none text-[11px] font-normal leading-tight text-white transition-all before:pointer-events-none before:mt-[6.5px] before:mr-1 before:box-border before:block before:h-1.5 before:w-2.5 before:rounded-tl-md before:border-t before:border-l before:border-blue-gray-200 before:transition-all after:pointer-events-none after:mt-[6.5px] after:ml-1 after:box-border after:block after:h-1.5 after:w-2.5 after:flex-grow after:rounded-tr-md after:border-t after:border-r after:border-blue-gray-200 after:transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:leading-[4.1] peer-placeholder-shown:text-blue-gray-500 peer-placeholder-shown:before:border-transparent peer-placeholder-shown:after:border-transparent peer-focus:text-[11px] peer-focus:leading-tight peer-focus:text-red-700 peer-focus:before:border-t-2 peer-focus:before:border-l-2 peer-focus:before:!border-red-500 peer-focus:after:border-t-2 peer-focus:after:border-r-2 peer-focus:after:!border-red-700 peer-disabled:text-transparent peer-disabled:before:border-transparent peer-disabled:after:border-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500"
          >
            Nombre
          </label>
          <p class="text-red-700 text-sm" *ngIf="isValidField('name')">{{getFieldError('name')}}</p>
        </div>
        <div class="relative h-11 w-full min-w-[200px]">
          <input
            type="password"
            class="h-full w-full rounded-md border placeholder-shown:border bg-transparent px-3 py-3 font-sans text-sm font-normal outline outline-0 transition-all peer border-blue-gray-200 text-white placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 focus:border-2 focus:border-red-700 focus:border-t-transparent focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0"
            placeHolder=" "
            formControlName="password"
          />
          <label
            class="before:content[' '] after:content[' '] pointer-events-none absolute left-0 -top-1.5 flex h-full w-full select-none text-[11px] font-normal leading-tight text-white transition-all before:pointer-events-none before:mt-[6.5px] before:mr-1 before:box-border before:block before:h-1.5 before:w-2.5 before:rounded-tl-md before:border-t before:border-l before:border-blue-gray-200 before:transition-all after:pointer-events-none after:mt-[6.5px] after:ml-1 after:box-border after:block after:h-1.5 after:w-2.5 after:flex-grow after:rounded-tr-md after:border-t after:border-r after:border-blue-gray-200 after:transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:leading-[4.1] peer-placeholder-shown:text-blue-gray-500 peer-placeholder-shown:before:border-transparent peer-placeholder-shown:after:border-transparent peer-focus:text-[11px] peer-focus:leading-tight peer-focus:text-red-700 peer-focus:before:border-t-2 peer-focus:before:border-l-2 peer-focus:before:!border-red-500 peer-focus:after:border-t-2 peer-focus:after:border-r-2 peer-focus:after:!border-red-700 peer-disabled:text-transparent peer-disabled:before:border-transparent peer-disabled:after:border-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500"
          >
            Contraseña
          </label>
          <p class="text-red-700 text-sm" *ngIf="isValidField('password')">{{getFieldError('password')}}</p>
        </div>
      </div>
      <button
        class="mt-9 block w-full select-none rounded-lg bg-red-700 px-6 py-3 text-center align-middle font-sans text-xs font-bold uppercase text-white shadow-md shadow-red-500/20 transition-all hover:shadow-lg hover:shadow-red-500/40 focus:opacity-[0.85] focus:shadow-none active:opacity-[0.85] active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none"
        type="submit"
        data-ripple-light="true"
        (click)="login()"
      >
        Acceder
      </button>
    </form>
    <div *ngIf="loginError">
      <p class="text-red-700 text-lg"><span>{{loginError}}</span></p>
    </div>
  </div>

  />
</div>

<p class="text-white">{{myForm.valid | json}} </p>
<p class="text-white">{{myForm.pristine |json}}</p>
<p class="text-white">{{myForm.touched |json}}</p>
<p class="text-white">{{myForm.controls['name'].value |json}}</p>
<p class="text-white">{{myForm.controls['name'].errors |json}}</p>
