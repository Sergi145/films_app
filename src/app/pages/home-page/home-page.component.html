<carrousel [bannerResult]="bannerResult"></carrousel>
<film-list [TrendingResult]="trendingMovieResult" (genderSelected)="onGenreChange($event)"></film-list>

<div class="flex justify-center m-6">
  <button
    (click)="prevPage()"
    class="px-4 py-2 bg-gray-600 text-white mr-2"
    [disabled]="currentPage === 1"
  >
    Anterior
  </button>

  <button
    (click)="nextPage()"
    class="px-4 py-2 bg-gray-600 text-white"
    [disabled]="currentPage === totalPages"
  >
    Siguiente
  </button>
</div>
<button-sesion></button-sesion>
